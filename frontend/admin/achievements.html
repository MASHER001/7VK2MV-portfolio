<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Experiences | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin-achievements.css">
</head>
<body class="page-admin-experiences" data-admin>
  <div class="shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="logo">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Portfolio</span>
      </div>
      <a href="dashboard.html"><span class="cat-avatar" data-cat="dashboard"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Dashboard</a>
      <a href="messages.html"><span class="cat-avatar" data-cat="messages"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>Messages</a>
      <a href="projects.html"><span class="cat-avatar" data-cat="projects"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg></span>Projects</a>
      <a href="skills.html"><span class="cat-avatar" data-cat="skills"><svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>Skills</a>
      <a href="certificates.html"><span class="cat-avatar" data-cat="certificates"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg></span>Certificates</a>
      <a href="achievements.html" class="active"><span class="cat-avatar" data-cat="achievements"><svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></span>Experiences</a>
      <a href="profile.html"><span class="cat-avatar" data-cat="profile"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Profile</a>
      <div class="spacer"></div>
      <a href="../index.html"><span class="cat-avatar"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></span>View site</a>
      <button class="linkbtn" data-logout type="button"><span class="cat-avatar"><svg class="i" viewBox="0 0 24 24"><path d="M9 4H4v16h5M16 8l4 4-4 4M20 12H9"/></svg></span>Log out</button>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar"><div class="crumb">Admin / <b>Experiences</b></div></header>

      <main class="content">
        <div class="head">
          <div class="heading-copy">
            <p class="page-kicker">Achievement manager</p>
            <h1>Experiences</h1>
            <p class="page-intro">Manage the milestones displayed on your public Experiences page.</p>
          </div>
          <div class="head-actions">
            <a class="btn secondary" href="../achievements.html" target="_blank" rel="noopener noreferrer">Preview page</a>
            <button class="btn primary" id="newBtn" type="button">+ Add experience</button>
          </div>
        </div>

        <div id="page-error"></div>

        <div class="toolbar">
          <input id="search" type="search" placeholder="Search experiences" aria-label="Search experiences">
          <select id="catFilter" aria-label="Filter by category"><option value="">All categories</option></select>
        </div>

        <section class="card table-wrap">
          <table aria-label="Experiences">
            <thead><tr><th>Experience</th><th>Category</th><th>Date</th><th>Order</th><th>Actions</th></tr></thead>
            <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <!-- ============ NEW / EDIT FORM ============
       Kept in a <template>: nothing from it is on the page until a button opens it. -->
  <template id="dlgTpl">
  <dialog id="dlg">
    <form id="aform" novalidate>
      <div class="dlg-head">
        <h2 id="dlgTitle">New experience</h2>
        <button class="x" type="button" id="closeBtn" aria-label="Close">&times;</button>
      </div>

      <div class="dlg-body">
        <div id="form-error"></div>
        <div class="g2">
          <div class="field full"><label for="title">Title *</label><input id="title" name="title" required maxlength="200" placeholder="Hackathon finalist"></div>

          <div class="field"><label for="category">Category</label><input id="category" name="category" maxlength="80" placeholder="Competition"></div>
          <div class="field"><label for="achievement_date">Date</label><input id="achievement_date" name="achievement_date" type="date"></div>

          <div class="field full"><label for="description">Description</label><textarea id="description" name="description" maxlength="1000"></textarea></div>

          <div class="field full"><label for="evidence_url">Evidence link</label><input id="evidence_url" name="evidence_url" type="url" placeholder="https://example.com/proof"></div>

          <div class="field full"><label for="image_url">Image</label>
            <div class="inline">
              <input id="image_url" name="image_url" type="url" placeholder="Upload an image or paste a link">
              <button class="btn secondary" type="button" id="imgBtn">Upload</button>
            </div>
            <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
            <div class="preview" id="preview"></div>
          </div>

          <div class="field"><label for="display_order">Display order</label><input id="display_order" name="display_order" type="number" step="1"></div>
          <div class="field check" style="align-self:end"><input id="is_featured" name="is_featured" type="checkbox"><label for="is_featured">Featured</label></div>
        </div>
      </div>

      <div class="dlg-foot">
        <button class="btn secondary" type="button" id="cancelBtn">Cancel</button>
        <button class="btn primary" type="submit" id="saveBtn">Save experience</button>
      </div>
    </form>
  </dialog>
  </template>

  <div class="toast" id="toast" role="status"></div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pages/admin/achievements.js"></script>
</body>
</html>
