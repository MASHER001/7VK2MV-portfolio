<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Messages | Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/admin-messages.css">
</head>
<body class="admin-messages" data-admin>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Portfolio</span>
      </div>
      <a href="dashboard.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="messages.html" class="active" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Messages</a>
      <a href="projects.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>Projects</a>
      <a href="skills.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Skills</a>
      <a href="certificates.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>Certificates</a>
      <a href="achievements.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Experiences</a>
      <a href="profile.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
      <div class="spacer"></div>
      <a href="../index.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>View site</a>
      <button class="linkbtn" data-logout type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5M16 8l4 4-4 4M20 12H9"/></svg>Log out</button>
    </aside>

    <div class="main">
      <header class="topbar"><div class="crumb">Admin / <b>Messages</b></div></header>
      <main class="content">
        <section class="chat-app" id="app" aria-label="Message inbox">
          <section class="pane list-pane" aria-label="Messages">
            <div class="pane-head">
              <h1>Messages</h1>
              <span class="round red" id="unread" title="Unread messages">0</span>
            </div>
            <input id="search" type="search" placeholder="Search messages" aria-label="Search messages">
            <div id="list"><p class="muted list-loading">Loading messages…</p></div>
          </section>

          <section class="pane chat-pane" id="chat" aria-label="Selected message"></section>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pages/admin/messages.js"></script>
</body>
</html>
