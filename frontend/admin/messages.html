<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Messages | Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body.neo{--bg:#262930;--hi:#2f333c;--lo:#1b1d22;--red:#ef4f4f;background:#1f2227}
    .neo .sidebar{background:#1f2227;border-color:#2a2d35}
    .neo .admin-main{max-width:1200px;padding:1.5rem}
    .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

    .chat-app{display:grid;grid-template-columns:350px 1fr;gap:1.5rem;height:calc(100vh - 3rem)}
    .pane{background:var(--bg);border-radius:30px;box-shadow:8px 8px 18px var(--lo),-6px -6px 14px var(--hi);display:flex;flex-direction:column;overflow:hidden;min-height:0}
    .pane-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1.25rem 1.25rem .75rem}
    .pane-head h1{margin:0;font-size:1.5rem}

    .round{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:var(--text);background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);flex:none;text-decoration:none;font:inherit;font-weight:700}
    .round.red{background:var(--red);color:#fff}
    .round:active{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
    .round.red:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.35)}

    #search{margin:0 1.25rem 1rem;width:auto;border:0;border-radius:16px;background:var(--bg);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
    #list{overflow-y:auto;flex:1;padding:0 .5rem .75rem}
    .item{display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;padding:.85rem .75rem;background:none;border:0;border-bottom:1px solid #30343d;color:var(--text);cursor:pointer;font:inherit;border-radius:16px}
    .item:hover,.item.active{background:#2b2f37}
    .avatar{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi),inset 0 0 0 2px #3a3f4a}
    .meta{flex:1;min-width:0;display:flex;flex-direction:column}
    .meta strong{font-size:.95rem}.meta small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:none}
    .time{font-size:.8rem;color:var(--muted)}.time.hot{color:var(--red)}
    .pill{background:var(--red);color:#fff;font-size:.7rem;font-weight:700;padding:.05rem .55rem;border-radius:99px;box-shadow:2px 2px 6px var(--lo)}
    .empty{display:grid;place-items:center;flex:1;color:var(--muted);padding:2rem;text-align:center}

    .chat-head{display:flex;align-items:center;gap:.85rem;padding:1.1rem 1.25rem}
    .chat-head .who{flex:1;min-width:0}.chat-head strong{display:block}.chat-head small{color:var(--muted)}
    .back{display:none}
    .thread{flex:1;overflow-y:auto;padding:0 1.5rem 1rem;display:flex;flex-direction:column;gap:.9rem}
    .day{text-align:center;color:var(--muted);font-size:.8rem;margin:.5rem 0}
    .bubble{max-width:min(560px,85%);padding:.8rem 1rem;border-radius:14px;box-shadow:4px 4px 10px var(--lo),-3px -3px 8px var(--hi);word-break:break-word;white-space:pre-wrap}
    .bubble.in{background:#2b2f37;align-self:flex-start}
    .bubble.out{background:var(--red);color:#fff;align-self:flex-end}
    .bubble b{display:block;margin-bottom:.3rem}
    .bubble time{display:block;text-align:right;font-size:.72rem;opacity:.7;margin-top:.3rem}

    .actions{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem 1.25rem}
    .bar{flex:1;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.5rem .75rem;border-radius:26px;background:var(--bg);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
    .bar .hint{color:var(--muted);font-size:.85rem;margin-right:auto;padding-left:.4rem}
    .chip{border:0;border-radius:99px;padding:.45rem .9rem;background:var(--bg);color:var(--text);cursor:pointer;font:inherit;font-size:.85rem;box-shadow:3px 3px 7px var(--lo),-3px -3px 7px var(--hi)}
    .chip:active{box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi)}

    @media (max-width:800px){
      .chat-app{grid-template-columns:1fr;height:78vh}
      .chat-pane{display:none}.chat-app.show-chat .list-pane{display:none}.chat-app.show-chat .chat-pane{display:flex}
      .back{display:grid}.neo .admin-main{padding:1rem}
    }
  </style>
</head>
<body class="neo" data-admin>
  <div class="admin">
    <aside class="sidebar">
      <h2>Admin</h2>
      <a href="dashboard.html">Dashboard</a>
      <a href="messages.html">Messages</a>
      <a href="projects.html">Projects</a>
      <a href="skills.html">Skills</a>
      <a href="certificates.html">Certificates</a>
      <a href="profile.html">Profile</a>
      <a href="../index.html">View site</a>
      <a href="#" data-logout>Log out</a>
    </aside>

    <main class="admin-main">
      <div class="chat-app" id="app">
        <section class="pane list-pane">
          <div class="pane-head">
            <h1>Messages</h1>
            <span class="round red" id="unread" title="Unread messages">0</span>
          </div>
          <input id="search" type="search" placeholder="Search messages" aria-label="Search messages">
          <div id="list"><p class="muted" style="padding:1rem">Loadingâ€¦</p></div>
        </section>

        <section class="pane chat-pane" id="chat"></section>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pages/admin/messages.js"></script>
</body>
</html>
