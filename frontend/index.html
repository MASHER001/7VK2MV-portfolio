<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="site page-home">

  <main class="hero">
    <span class="plus" style="left:4%;top:3%"></span>
    <span class="plus" style="right:4%;top:3%"></span>
    <span class="plus" style="left:4%;top:34%"></span>
    <span class="plus" style="right:4%;top:34%"></span>

    <header class="top">
      <div class="label">Welcome<br>to my</div>
      <div class="menu-wrap">
        <span class="menu-tip" id="menuTip" role="tooltip">Menu</span>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5">
            <circle cx="32" cy="32" r="29"/>
            <path d="M32 13l19 19-19 19-19-19z"/>
            <circle cx="32" cy="32" r="6" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="titlebox">
      <div class="slab"></div>
      <h1 class="word" id="word" data-word="PORTFOLIO" aria-label="Portfolio"></h1>
    </section>

    <div class="meta label">
      <span id="who">Victor Lewis Machariah</span>
      <span id="role">Full-Stack Web Developer</span>
    </div>

    <!-- Fan wrapper: ring + arrows + cards together -->
    <div class="fan-wrap">
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 300 300">
          <defs>
            <path id="circ" d="M150,150 m-118,0 a118,118 0 1,1 236,0 a118,118 0 1,1 -236,0"/>
          </defs>
          <text>
            <textPath href="#circ" textLength="738" lengthAdjust="spacing">
              PORTFOLIO · PORTFOLIO · PORTFOLIO · PORTFOLIO · PORTFOLIO · PORTFOLIO ·
            </textPath>
          </text>
        </svg>
      </div>

      <button class="arrow left" id="prev" aria-label="Previous card"></button>
      <section class="stage" id="stage" aria-label="Site sections"></section>
      <button class="arrow right" id="next" aria-label="Next card"></button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <a href="admin/login.html" class="admin-link" aria-label="Admin panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <span class="admin-tip">Admin</span>
      </a>
    </div>
    <div class="footer-center">
      <p class="copyright">© <span id="year">2026</span> <span id="footer-name">Victor Lewis Machariah</span></p>
    </div>
    <div class="footer-right">
      <p class="made-with">
        Made with <span class="heart" aria-label="love">❤️</span> by <strong>MACHARIA VICTOR LEWIS</strong>
      </p>
    </div>
  </footer>

  <nav class="menu" id="menu" aria-label="Main menu">
