<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-contact">
  <div class="page">
    <span class="plus" style="left:.4rem;top:.6rem"></span>
    <span class="plus" style="right:.4rem;top:.6rem"></span>

    <header class="top">
      <div class="label"><a href="index.html">&larr; Home</a><br>Say hello</div>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5">
          <circle cx="32" cy="32" r="29"/>
          <path d="M32 13l19 19-19 19-19-19z"/>
          <circle cx="32" cy="32" r="6" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <section class="titlebox">
      <div class="slab"></div>
      <h1 class="word" id="word" data-word="CONTACT" aria-label="Contact"></h1>
    </section>

    <div class="meta label">
      <span id="who">&nbsp;</span>
      <span id="role">&nbsp;</span>
    </div>

    <div class="grid">
      <aside class="stack" id="info"></aside>

      <section class="card reveal" id="formCard">
        <h2>Send a message</h2>
        <form id="contact-form" novalidate>
          <div class="two">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" autocomplete="name" maxlength="100" required>
              <p class="err" id="err-name"></p>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
              <p class="err" id="err-email"></p>
            </div>
          </div>

          <div class="field">
            <label for="subject">Subject <span style="opacity:.6">(optional)</span></label>
            <input id="subject" name="subject" maxlength="200">
            <p class="err" id="err-subject"></p>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" maxlength="5000" required></textarea>
            <div class="hint">
              <span class="err" id="err-message"></span>
              <span id="counter">0 / 5000</span>
            </div>
          </div>

          <!-- Honeypot — hidden from humans, visible to bots -->
          <div class="hp" aria-hidden="true">
            <label for="website">Leave this empty</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div id="form-error" role="alert"></div>

          <button class="send" type="submit" id="sendBtn">
            Send message <span aria-hidden="true">&rarr;</span>
          </button>
        </form>
      </section>
    </div>
  </div>

  <footer class="site-footer" id="footer-text"></footer>

  <nav class="menu" id="menu" aria-label="Main menu">
    <button class="close" id="menuClose" aria-label="Close menu">&times;</button>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="skills.html">Skills</a>
    <a href="projects.html">Projects</a>
    <a href="certificates.html">Certificates</a>
    <a href="contact.html">Contact</a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
